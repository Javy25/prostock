<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prostock - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html"><img src="img/logo-prostock.svg" class="brand-logo" alt="Prostock"></a>
        </div>
    </nav>

    <main class="container my-5 col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Iniciar Sesión</h3>

                <div id="alert-container"></div>

                <form id="form-login">
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" id="login-email" class="form-control" required placeholder="correo@duoc.cl">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="login-pass" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Ingresar</button>
                </form>

                <div class="text-center mt-3">
                    <small>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></small>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/validation.js"></script>
</body>
</html>
