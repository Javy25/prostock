<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prostock Admin - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><img src="../img/logo-prostock.svg" class="brand-logo" alt="Prostock"> <span class="admin-label">ADMIN</span></a>
            <a href="../index.html" class="btn btn-outline-light btn-sm">Volver a la Tienda</a>
        </div>
    </nav>

    <div class="container-fluid my-4">
        <div class="row">
            <!-- Sidebar Navigation -->
            <div class="col-md-3 col-lg-2 mb-3">
                <div class="list-group shadow-sm">
                    <a href="index.html" class="list-group-item list-group-item-action active">Dashboard</a>
                    <a href="productos-listar.html" class="list-group-item list-group-item-action">Productos</a>
                    <a href="usuarios-listar.html" class="list-group-item list-group-item-action">Usuarios</a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10">
                <h3 class="mb-4">Panel de Control</h3>
                
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm bg-primary text-white p-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="text-uppercase mb-1">Productos Totales</h6>
                                    <h2 id="dash-cant-productos" class="mb-0">0</h2>
                                </div>
                                <i class="bi bi-box-seam fs-1"></i>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm bg-success text-white p-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="text-uppercase mb-1">Usuarios Registrados</h6>
                                    <h2 id="dash-cant-usuarios" class="mb-0">0</h2>
                                </div>
                                <i class="bi bi-people fs-1"></i>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm bg-warning text-dark p-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="text-uppercase mb-1">Acciones Rápidas</h6>
                                    <a href="producto-form.html" class="btn btn-sm btn-dark mt-2">+ Nuevo Producto</a>
                                </div>
                                <i class="bi bi-lightning-charge fs-1"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const productos = JSON.parse(localStorage.getItem('productos_db')) || [];
            const usuarios = JSON.parse(localStorage.getItem('usuarios_db')) || [];

            document.getElementById('dash-cant-productos').textContent = productos.length;
            document.getElementById('dash-cant-usuarios').textContent = usuarios.length;
        });
    </script>
</body>
</html>
