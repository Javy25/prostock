<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prostock Admin - Mantenedor de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">PROSTOCK ADMIN</a>
            <a href="../index.html" class="btn btn-outline-light btn-sm">Volver a la Tienda</a>
        </div>
    </nav>

    <div class="container-fluid my-4">
        <div class="row">
            <div class="col-md-3 col-lg-2 mb-3">
                <div class="list-group shadow-sm">
                    <a href="index.html" class="list-group-item list-group-item-action">Dashboard</a>
                    <a href="productos-listar.html" class="list-group-item list-group-item-action">Productos</a>
                    <a href="usuarios-listar.html" class="list-group-item list-group-item-action active">Usuarios</a>
                </div>
            </div>

            <div class="col-md-9 col-lg-10">
                <div class="d-flex justify-content-between align-items-center mb-3">

                    <a href="usuario-form.html" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i> Nuevo Usuario</a>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Nombre</th>
                                        <th>Email</th>
                                        <th>Rol</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-admin-usuarios"></tbody>
                            </table>

        </div>

    <script src="../js/admin.js"></script>
