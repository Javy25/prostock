<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prostock - Carrito de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><img src="img/logo-prostock.svg" class="brand-logo" alt="Prostock"></a>
            <div class="d-flex align-items-center" id="user-navbar-info"></div>
        </div>
    </nav>

    <main class="container my-5">
        <h2 class="mb-4"><i class="bi bi-cart3"></i> Carrito de Compras</h2>
        
        <div class="row">
            <div class="col-lg-8 mb-4">
                <div class="table-responsive shadow-sm border rounded">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Subtotal</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-carrito"></tbody>
                    </table>
                </div>
                <button onclick="vaciarCarrito()" class="btn btn-outline-secondary btn-sm mt-3">
                    <i class="bi bi-trash"></i> Vaciar Carrito
                </button>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title fw-bold border-bottom pb-2">Resumen de Orden</h5>
                        <div class="d-flex justify-content-between my-2">
                            <span>Subtotal Neto:</span>
                            <span id="carrito-subtotal">$0</span>
                        </div>
                        <div class="d-flex justify-content-between my-2">
                            <span>IVA (19%):</span>
                            <span id="carrito-iva">$0</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between fs-5 fw-bold mb-3">
                            <span>Total:</span>
                            <span id="carrito-total" class="text-primary">$0</span>
                        </div>
                        <button onclick="procesarCompra()" class="btn btn-success w-100 py-2 fw-bold">
                            Pagar Pedido
                        </button>
                        <a href="productos.html" class="btn btn-link w-100 mt-2 text-decoration-none">
                            Seguir comprando
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
