<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prostock - Detalle de Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html"><img src="img/logo-prostock.svg" class="brand-logo" alt="Prostock"></a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="blogs.html">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="carrito.html" class="btn btn-outline-light position-relative" aria-label="Carrito de compras">
                        <i class="bi bi-cart3"></i>
                        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                    </a>
                    <div id="user-navbar-info" class="text-white small"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row bg-white p-4 rounded shadow-sm border" id="detalle-container">
            <!-- Cargado dinámicamente mediante JS -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const id = Number(params.get('id'));
            const productosGuardados = localStorage.getItem('productos_db');
            let productos;

            if (productosGuardados) {
                productos = JSON.parse(productosGuardados);
            } else {
                try {
                    const respuesta = await fetch('data/productos.json');
                    if (!respuesta.ok) throw new Error('No se pudieron cargar los productos iniciales.');
                    productos = await respuesta.json();
                    localStorage.setItem('productos_db', JSON.stringify(productos));
                } catch (error) {
                    productos = [];
                }
            }
            const producto = productos.find(p => p.id === id);

            const container = document.getElementById('detalle-container');
            if (!producto) {
                container.innerHTML = `<div class="col-12 text-center py-5"><h4>Producto no encontrado.</h4><a href="productos.html" class="btn btn-primary mt-3">Volver al catálogo</a></div>`;
                return;
            }

            const imagenes = producto.imagenes?.length ? producto.imagenes : [producto.imagen];
            const indicadores = imagenes.map((imagen, indice) => `
                <button type="button" data-bs-target="#productoCarrusel" data-bs-slide-to="${indice}" class="${indice === 0 ? 'active' : ''}" aria-label="Imagen ${indice + 1}"></button>
            `).join('');
            const slides = imagenes.map((imagen, indice) => `
                <div class="carousel-item ${indice === 0 ? 'active' : ''}">
                    <img src="${escaparHTML(imagen)}" class="d-block w-100 product-detail-image" alt="${escaparHTML(producto.nombre)}, imagen ${indice + 1}">
                </div>
            `).join('');

            container.innerHTML = `
                <div class="col-md-6 text-center">
                    <div id="productoCarrusel" class="carousel slide product-carousel" data-bs-ride="false">
                        <div class="carousel-indicators">${indicadores}</div>
                        <div class="carousel-inner">${slides}</div>
                        ${imagenes.length > 1 ? `<button class="carousel-control-prev" type="button" data-bs-target="#productoCarrusel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span><span class="visually-hidden">Anterior</span></button><button class="carousel-control-next" type="button" data-bs-target="#productoCarrusel" data-bs-slide="next"><span class="carousel-control-next-icon"></span><span class="visually-hidden">Siguiente</span></button>` : ''}
                    </div>
                </div>
                <div class="col-md-6 d-flex flex-column justify-content-center">
                    <span class="badge bg-secondary mb-2 w-fit-content">${escaparHTML(producto.categoria)}</span>
                    <h2>${escaparHTML(producto.nombre)}</h2>
                    <p class="text-muted mb-1">SKU / Código: <strong>${escaparHTML(producto.codigo)}</strong></p>
                    <h3 class="text-primary fw-bold my-3">$${calcularPrecioConIva(producto.precio).toLocaleString('es-CL')}</h3>
                    <p class="text-muted small mb-1">Precio con IVA incluido</p>
                    <p>Stock disponible: <strong>${producto.stock} unidades</strong></p>
                    <div class="d-flex gap-2 mt-3">
                        <button onclick="agregarAlCarrito(${producto.id})" class="btn btn-danger btn-lg">
                            <i class="bi bi-cart-plus"></i> Agregar al Carrito
                        </button>
                        <a href="productos.html" class="btn btn-outline-secondary btn-lg">Volver</a>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>>>
