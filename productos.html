<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProStock - Catalogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">ProStock</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
                <a href="carrito.html" class="btn btn-primary">
                    Carrito <span id="cart-count" class="badge bg-light text-dark ms-1">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">
        <div class="row g-4">
            <!-- Sidebar de Filtros -->
            <aside class="col-md-3">
                <div class="card p-3 shadow-sm">
                    <h5 class="card-title fw-bold border-bottom pb-2">Filtros de Busqueda</h5>
                    <div class="mb-3">
                        <label for="search-input" class="form-label small fw-bold">Buscar producto:</label>
                        <input type="text" id="search-input" class="form-control" placeholder="Nombre o SKU...">
                    </div>
                    <div class="mb-3">
                        <label for="category-select" class="form-label small fw-bold">Categoria:</label>
                        <select id="category-select" class="form-select">
                            <option value="todas">Todas las categorias</option>
                            <option value="Escritorio">Escritorio</option>
                            <option value="Papeleria">Papeleria</option>
                            <option value="Tecnologia">Tecnologia</option>
                        </select>
                    </div>
                </div>
            </aside>

            <!-- Grilla de Productos -->
            <section class="col-md-9">
                <div class="row row-cols-1 row-cols-md-3 g-4" id="products-grid">
                    <!-- Renderizado dinámico con JS -->
                </div>
            </section>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0 small">&copy; 2026 ProStock - Sistema de Gestion y Tienda Online.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
