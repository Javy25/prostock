server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${FRONTEND_ORIGIN:http://localhost:5173}
              - http://127.0.0.1:5173
              - http://localhost:4173
              - http://127.0.0.1:4173
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/products/**
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/users/**,/api/auth/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**
        - id: contact-service
          uri: ${CONTACT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/messages/**

security:
  jwt-secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
