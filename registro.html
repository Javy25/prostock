<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prostock - Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">PROSTOCK</a>
        </div>
    </nav>

    <main class="container my-4 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Crear una Cuenta</h3>

                <div id="alert-container"></div>

                <form id="form-registro">
                    <div class="mb-3">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" id="nombre" class="form-control" required placeholder="Juan Pérez">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" id="email" class="form-control" required placeholder="usuario@duoc.cl / gmail.com">
                        <div class="form-text">Dominios aceptados: @duoc.cl, @profesor.duoc.cl, @gmail.com</div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Región</label>
                            <select id="select-region" class="form-select" required>
                                <option value="">Cargando regiones...</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Comuna</label>
                            <select id="select-comuna" class="form-select" required disabled>
                                <option value="">Seleccione primero una región</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" id="password" class="form-control" minlength="4" maxlength="10" required>
                            <div class="form-text">De 4 a 10 caracteres.</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Confirmar Contraseña</label>
                            <input type="password" id="confirmPassword" class="form-control" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-3">Registrarse</button>
                </form>

                <div class="text-center mt-3">
                    <small>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></small>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/validation.js"></script>
</body>
</html>
