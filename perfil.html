<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProStock - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html"><img src="img/logo-prostock.svg" class="brand-logo" alt="Prostock"></a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="blogs.html">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="carrito.html" class="btn btn-outline-light position-relative" aria-label="Carrito de compras">
                        <i class="bi bi-cart3"></i>
                        <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                    </a>
                    <div id="user-navbar-info" class="text-white small"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card shadow-sm text-center p-4">
                    <div class="mb-3">
                        <div class="bg-secondary text-white rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 80px; height: 80px; font-size: 32px;">
                            <span id="perfil-iniciales"></span>
                        </div>
                    </div>
                    <h5 id="perfil-nombre" class="fw-bold mb-1"></h5>
                    <p id="perfil-rol" class="text-muted small mb-3"></p>
                    <button class="btn btn-outline-danger btn-sm w-100" onclick="cerrarSesion()">Cerrar Sesión</button>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white fw-bold">Información Personal</div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted small mb-0">RUN</label>
                                <p id="perfil-run" class="fw-bold mb-0">No registrado</p>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small mb-0">Correo Electrónico</label>
                                <p id="perfil-email" class="fw-bold mb-0"></p>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small mb-0">Región</label>
                                <p id="perfil-region" class="fw-bold mb-0">No registrada</p>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small mb-0">Comuna</label>
                                <p id="perfil-comuna" class="fw-bold mb-0">No registrada</p>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-muted small mb-0">Dirección de Despacho</label>
                                <p id="perfil-direccion" class="fw-bold mb-0">No registrada</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-white fw-bold">Historial de Compras Recientes</div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table mb-0 align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>N° Pedido</th>
                                        <th>Fecha</th>
                                        <th>Total</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="perfil-pedidos"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0 small">&copy; 2026 ProStock - Sistema de Gestión y Tienda Online.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
